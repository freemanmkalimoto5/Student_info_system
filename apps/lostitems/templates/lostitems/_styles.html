<style>
  /* ---- Lost Items: shared look ---- */
  .li-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:2px 0 10px}

  .li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .li-name{font-size:.95rem;color:#1f2d3d;line-height:1.25;word-break:break-word}
  .li-date{color:#8792a2;font-size:.78rem;margin:2px 0 8px}
  .li-money{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}

  .lp-page{max-width:640px;margin:0 auto}
