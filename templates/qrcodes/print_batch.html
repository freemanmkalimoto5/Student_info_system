<!doctype html>
<html><head><meta charset="utf-8"><title>{{ label }} - QR Codes</title>
<style>
  body{font-family:system-ui,Arial;margin:20px;color:#1f2d3d}
  h1{font-size:1.2rem;border-bottom:2px solid #1f3b5e;padding-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
  .item{text-align:center;border:1px solid #ddd;border-radius:8px;padding:8px;page-break-inside:avoid}
  .item img{width:100%;height:auto}
  .no{font-weight:700;margin-top:4px}
  .nm{font-size:12px;color:#444}
  .class-h{grid-column:1/-1;margin:18px 0 4px;font-weight:700;color:#1f3b5e;border-top:1px solid #ccc;padding-top:10px}
  @media print{.no-print{display:none}}
</style></head>
<body>
  <div class="no-print" style="margin-bottom:14px">
    <button onclick="window.print()">Print</button>
  </div>
  <h1>{{ label }} - QR Codes</h1>
  <div class="grid">
  {% for s in students %}
    {% ifchanged s.grade_class %}<div class="class-h">{{ s.get_grade_class_display }}</div>{% endifchanged %}
    {% if s.card and s.card.qr_image and not s.card.is_expired %}
    <div class="item">
      <img src="{{ s.card.qr_image.url }}">
      <div class="no">{{ s.student_number }}</div>
      <div class="nm">{{ s.full_name }}</div>
    </div>
    {% endif %}
  {% endfor %}
  </div>
</body></html>
